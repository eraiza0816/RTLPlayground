<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="login_title">RTL Switch Login</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --primary: #1e293b;
      --accent: #1976D2;
      --accent-hover: #1565C0;
      --text: #424242;
      --text-muted: #757575;
      --error-bg: #ffebee;
      --error-text: #c62828;
      --input-bg: #f5f5f5;
      --input-border: #bdbdbd;
      --md-el-4: 0 8px 16px rgba(0,0,0,0.14), 0 4px 8px rgba(0,0,0,0.12);
      --md-el-2: 0 4px 8px rgba(0,0,0,0.14), 0 2px 4px rgba(0,0,0,0.12);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
    }
    .login-card {
      background: #fff;
      width: 100%;
      max-width: 400px;
      border-radius: 8px;
      box-shadow: var(--md-el-4);
      overflow: hidden;
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .card-header {
      background: var(--primary);
      color: #fff;
      padding: 30px;
      text-align: center;
    }
    .card-header h1 { margin: 0; font-size: 1.5rem; font-weight: 400; letter-spacing: 0; }
    .card-header p { margin: 10px 0 0 0; color: #94a3b8; font-size: 0.9rem; }
    .card-body { padding: 32px 24px; }
    .input-group { margin-bottom: 24px; }
    .input-group label {
      display: block;
      margin-bottom: 4px;
      font-weight: 400;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-bottom: 2px solid var(--input-border);
      border-radius: 4px 4px 0 0;
      background: var(--input-bg);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus { border-bottom-color: var(--accent); }
    .btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: 0.2s;
      margin-top: 8px;
      min-height: 48px;
    }
    .btn:hover { background: var(--accent-hover); box-shadow: var(--md-el-2); }
    .error-msg {
      display: none;
      background: var(--error-bg);
      color: var(--error-text);
      padding: 12px;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var s = document.createElement('script');
      s.src = '/i18n.js';
      document.head.appendChild(s);
    });
  </script>
  <script>
    function removeNote() { document.getElementById('incorrect').style.display = 'none'; }
    window.addEventListener('load', function() {
      if (document.referrer.endsWith('login.html')) {
        document.getElementById('incorrect').innerHTML = t('login_wrong');
        document.getElementById('incorrect').style.display = 'block';
      }
      document.title = t('login_title');
    });
  </script>
  <script>
    /* A stored PSK means the switch runs in PSK mode: the main.js issues
     * the session through the encrypted /enc endpoint, so the login page
     * can go straight to the dashboard. */
    document.addEventListener('DOMContentLoaded', function() {
      var stored = localStorage.getItem('rtlpsk');
      if (stored && /^[0-9a-f]{64}$/.test(stored)) {
        window.location.href = '/index.html';
      }
    });
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var h = document.getElementById('psk').value.trim().toLowerCase();
        var p = document.getElementById('pwd').value;
        if (h) {
          if (!/^[0-9a-f]{64}$/.test(h)) {
            document.getElementById('incorrect').innerHTML = 'PSK must be 64 hex characters (32 bytes)';
            document.getElementById('incorrect').style.display = 'block';
            return;
          }
          localStorage.setItem('rtlpsk', h);
          window.location.href = '/index.html';
        } else if (p) {
          /* Password mode: forget any stored PSK so the UI falls back to
           * plaintext (session) mode instead of encrypting with a stale key. */
          localStorage.removeItem('rtlpsk');
          var x = new XMLHttpRequest();
          x.open('POST', '/login', true);
          x.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
          x.onload = function() {
            /* On a PSK-configured switch the password login is refused and
             * the server redirects back to login.html; detect that via the
             * final URL instead of following it to the dashboard. */
            var landed = x.responseURL || '';
            if ((x.status === 200 || x.status === 302) && landed.indexOf('login.html') < 0) {
              window.location.href = '/index.html';
            } else {
              document.getElementById('incorrect').innerHTML = 'Password login rejected (PSK mode?) or wrong password';
              document.getElementById('incorrect').style.display = 'block';
            }
          };
          x.onerror = function() {
            document.getElementById('incorrect').innerHTML = 'Network error';
            document.getElementById('incorrect').style.display = 'block';
          };
          x.send('pwd=' + encodeURIComponent(p));
        } else {
          document.getElementById('incorrect').innerHTML = 'Enter a PSK or the system password';
          document.getElementById('incorrect').style.display = 'block';
        }
      });
    });
  </script>
</head>
<body>
  <div class="login-card">
    <div class="card-header">
      <h1>RTL Switch</h1>
      <p data-i18n="login_heading">Management Interface</p>
    </div>
    <div class="card-body">
      <div id="incorrect" class="error-msg"></div>
      <form id="loginForm">
        <div class="input-group">
          <label for="psk" data-i18n="login_password">Pre-Shared Key</label>
          <input type="text" id="psk" name="psk" placeholder="64 hex chars (32 bytes)" autocapitalize="off" autocorrect="off" spellcheck="false" onclick="removeNote()" />
          <button type="submit" class="btn" data-i18n="login_login">Login (PSK)</button>
        </div>
        <div style="text-align:center;color:var(--text-muted);margin:16px 0;font-size:0.85rem;">or (PSK not set yet)</div>
        <div class="input-group">
          <label for="pwd">System Password</label>
          <input type="password" id="pwd" name="pwd" placeholder="••••••••" onclick="removeNote()" />
          <button type="submit" class="btn" style="background:#546e7a;">Password Login</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
